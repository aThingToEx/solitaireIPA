name: Build IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode version
        run: |
          # Use a stable Xcode configuration that matches the project constraints
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Compile Standalone Mobile App
        run: |
          # Build by specifically targeting the iOS platform stack and stripping desktop extensions
          xcodebuild archive \
                     -project ComputerSolitaire.xcodeproj \
                     -scheme ComputerSolitaire \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/ComputerSolitaire.xcarchive \
                     -skipPackagePluginValidation \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO

          # Create Sideloadly payload tree structure
          mkdir -p Payload

          # Copy over the isolated app package binary
          cp -R build/ComputerSolitaire.xcarchive/Products/Applications/*.app Payload/

          # Package it as a clear installation archive
          zip -r ComputerSolitaire.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComputerSolitaire-IPA
          path: ComputerSolitaire.ipa
