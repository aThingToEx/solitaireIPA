name: Build IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Force Build No-Sign
        run: |
          # Compile explicitly targeting an iPhone architecture
          xcodebuild -project ComputerSolitaire.xcodeproj \
                     -scheme ComputerSolitaire \
                     -destination 'generic/platform=iOS' \
                     -configuration Release \
                     -derivedDataPath output_folder \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build
          
          # Create Sideloadly payload packaging folder
          mkdir -p Payload
          
          # Find any generated .app bundle inside the build folder and copy it to Payload
          find output_folder -name "ComputerSolitaire.app" -exec cp -R {} Payload/ \;
          
          # Verify the app bundle was successfully grabbed
          if [ ! -d "Payload/ComputerSolitaire.app" ]; then
            echo "ERROR: ComputerSolitaire.app file could not be located in the build directory."
            exit 1
          fi
          
          # Compress into an installation-ready .ipa archive
          zip -r ComputerSolitaire.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComputerSolitaire-IPA
          path: ComputerSolitaire.ipa
