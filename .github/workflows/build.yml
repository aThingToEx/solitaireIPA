name: Build IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Force Build No-Sign
        run: |
          # Build the app and force it to output into a local 'build' folder
          xcodebuild -project ComputerSolitaire.xcodeproj \
                     -scheme ComputerSolitaire \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build
          
          # Create the required Sideloadly folder structure
          mkdir -p Payload
          
          # Find the compiled .app file inside the local build directory and copy it
          cp -R build/Build/Products/Release-iphoneos/ComputerSolitaire.app Payload/
          
          # Zip it up into a clean .ipa package
          zip -r ComputerSolitaire.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComputerSolitaire-IPA
          path: ComputerSolitaire.ipa
