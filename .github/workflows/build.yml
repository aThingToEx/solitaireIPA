name: Build IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Archive and Package iOS App
        run: |
          # 1. Force compilation explicitly into a standalone iOS Archive
          xcodebuild archive \
                     -project ComputerSolitaire.xcodeproj \
                     -scheme ComputerSolitaire \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/ComputerSolitaire.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO

          # 2. Re-create the standard Sideloadly payload container structure
          mkdir -p Payload

          # 3. Pull the compiled app bundle directly out of the generated archive
          cp -R build/ComputerSolitaire.xcarchive/Products/Applications/ComputerSolitaire.app Payload/

          # 4. Zip the payload into an official .ipa installation bundle
          zip -r ComputerSolitaire.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComputerSolitaire-IPA
          path: ComputerSolitaire.ipa
